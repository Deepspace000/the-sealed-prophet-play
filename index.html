<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>The Sealed Prophet</title>
<style>
  /* Sizes follow the screen. --u: layout  --k: the hot bar and pack (much smaller on a phone)  --t: text  --b: touch buttons */
  :root { --u: 1; --k: 1; --t: 1; --b: 1; --z: 1; }
  /* No zooming of the page by a pinch or a double tap, anywhere (iPad: Safari takes no notice of user-scalable=no). Lists still slide. */
  * { touch-action: pan-x pan-y; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { font-family: "Gill Sans", "Century Gothic", "Trebuchet MS", sans-serif; color: #e8d9a8;
         user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; image-rendering: pixelated; }
  #tint { position: fixed; inset: 0; background: rgba(10, 70, 85, 0.45); opacity: 0; transition: opacity .15s; pointer-events: none; }
  #title { position: fixed; left: 14px; top: 10px; letter-spacing: .28em; font-size: calc(13px * var(--t)); color: #d9b65a; pointer-events: none; }
  .ver { letter-spacing: .1em; color: #7d6a3c; font-size: .85em; }
  #title small { display: block; letter-spacing: .12em; color: #a89868; font-size: calc(12px * var(--t)); margin-top: 3px; }
  #help { position: fixed; left: 14px; right: max(calc(min(210px * var(--u), 40vw) + 30px), 160px); top: calc(46px * var(--t) + 30px); font-size: calc(12px * var(--t)); line-height: 1.5; color: #c9bb8e;
          pointer-events: none; text-shadow: 0 1px 2px #000; }
  /* the controls: a row per kind of thing, each in its own colour */
  .hg { --c: #c9bb8e; display: flex; align-items: baseline; gap: 10px; margin: 0 0 3px; }
  .hg.c-move { --c: #6fa8ff; } .hg.c-look { --c: #4fd1c0; } .hg.c-thing { --c: #e6bf4a; }
  .hg.c-fight { --c: #ff6e5e; } .hg.c-live { --c: #90d56a; } .hg.c-game { --c: #b890ff; }
  .hl { flex: 0 0 5.4em; font-weight: normal; font-size: .82em; letter-spacing: .16em; color: var(--c); border-left: 3px solid var(--c); padding-left: 7px; }
  .hg span { color: #d8cfae; }
  .hg kbd { font: inherit; font-size: .92em; color: var(--c); background: rgba(8,6,3,.75); border: 1px solid var(--c); border-radius: 3px; padding: 0 5px; white-space: nowrap; }
  #helpBtn { position: fixed; left: 14px; top: calc(46px * var(--t)); z-index: 6; font: inherit; font-size: 10px; letter-spacing: .2em; color: #e8d9a8;
             background: rgba(8,6,3,.8); border: 1px solid #d9b65a; padding: 5px 9px; cursor: pointer; }
  #helpBtn:hover { background: #d9b65a; color: #17120a; }
  #lockHint { display: none; position: fixed; left: 50%; top: 38%; transform: translateX(-50%); padding: 5px 12px; font-size: 10px; letter-spacing: .24em; color: #e8d9a8;
              background: rgba(8,6,3,.7); border: 1px solid #7d6a3c; pointer-events: none; }
  #look { position: fixed; left: 50%; top: 54%; transform: translateX(-50%); font-size: calc(14px * var(--t)); letter-spacing: .1em;
          text-shadow: 0 1px 3px #000; pointer-events: none; }
  #msg { position: fixed; left: 50%; top: 22%; transform: translateX(-50%); padding: 6px 16px; font-size: calc(14px * var(--t));
         width: max-content; max-width: 88vw; box-sizing: border-box; text-align: center;
         background: rgba(0,0,0,.65); border-top: 1px solid #d9b65a; border-bottom: 1px solid #d9b65a;
         opacity: 0; transition: opacity .3s; pointer-events: none; }
  #inv { touch-action: none; position: fixed; left: 50%; bottom: calc(8px * var(--k)); transform: translateX(-50%); display: flex; flex-direction: column;
         align-items: center; gap: calc(6px * var(--k)); width: max-content; max-width: 96vw; }
  #bar, #panel { display: flex; gap: calc(12px * var(--k)); align-items: flex-end; flex-wrap: wrap; justify-content: center;
                 padding: calc(8px * var(--k)) calc(12px * var(--k)) calc(5px * var(--k)); background: rgba(8,6,3,.82); border: 1px solid #d9b65a;
                 clip-path: polygon(8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px), 0 8px); }
  #panel { display: none; }
  .group { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .group label { font-size: calc(10px * var(--t)); letter-spacing: .22em; text-transform: uppercase; color: #a89868; }
  .slots { display: flex; gap: calc(4px * var(--k)); flex-wrap: wrap; max-width: calc(330px * var(--k)); justify-content: center; }
  html.phone .group label { font-size: 8px; letter-spacing: .1em; }
  html.phone .group { gap: 1px; }
  html.phone body.touch #bar button { padding: 10px 7px; font-size: 10px; letter-spacing: .1em; }
  .slot { position: relative; width: calc(50px * var(--k)); height: calc(50px * var(--k)); background: #17120a; border: 1px solid #7d6a3c; cursor: pointer; }
  .slot:hover, .slot.focus { border-color: #ffe39a; background: #2a2110; }
  .slot.lit { border-color: #ffb347; box-shadow: 0 0 9px 1px rgba(255,170,60,.75), inset 0 0 8px rgba(255,170,60,.5); }
  .slot i { position: absolute; inset: 3px; background-size: contain; background-repeat: no-repeat; background-position: center;
            image-rendering: pixelated; }
  .slot i.art { inset: 1px; image-rendering: auto; }
  .slot .fuel { position: absolute; left: 4px; right: 4px; bottom: 3px; height: 3px; background: rgba(0,0,0,.65); pointer-events: none; }
  .slot .fuel s { display: block; height: 100%; width: 100%; background: #ffb347; }
  .slot .fuel.low s { background: #ff5a36; }
  /* what you can do with a thing you carry */
  #opts { display: none; gap: 6px; justify-content: center; }      /* always in this one place, just above the belt */
  #inv #opts button { width: min(calc(84px * var(--t)), 21vw); padding: calc(9px * var(--t)) 0; white-space: nowrap; text-align: center; letter-spacing: .1em; }
  #inv #opts button:first-child { width: min(calc(108px * var(--t)), 27vw); }
  body.touch #inv #opts button { padding: calc(14px * var(--t)) 0; font-size: calc(12px * var(--t)); }
  #inv #opts button.off { opacity: .28; cursor: default; }
  .slot.sel { border-color: #ffe39a; background: #2a2110; box-shadow: inset 0 0 0 2px #d9b65a; }
  body.touch #bar button { padding: calc(15px * var(--k)) calc(16px * var(--k)); font-size: calc(13px * var(--t)); }      /* the one PACK button, beside the hot bar, big enough for a finger */
  #inv #opts button:not(.off):hover, #inv #opts button.focus { background: #d9b65a; color: #17120a; }
  /* the cursor / camera switch above PACK: the gold knob sits under the one in use */
  .mode { position: relative; display: flex; width: calc(64px * var(--k)); height: calc(24px * var(--k)); background: #17120a; border: 1px solid #7d6a3c;
          border-radius: calc(12px * var(--k)); cursor: pointer; }
  .mode:hover { border-color: #ffe39a; }
  .mode .knob { position: absolute; top: 2px; bottom: 2px; left: 2px; width: calc(50% - 2px); border-radius: calc(10px * var(--k)); background: #d9b65a;
                transition: transform .18s; }
  .mode.cam .knob { transform: translateX(100%); }
  .mode b { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; color: #a89868; transition: color .18s; }
  .mode b svg { width: calc(14px * var(--k)); height: calc(14px * var(--k)); }
  .mode:not(.cam) .cur, .mode.cam .eye { color: #17120a; }
  body.touch .mode, body.touch .modeKey { display: none; }
  .group label.modeKey { font-size: calc(8px * var(--t)); letter-spacing: .25em; margin-bottom: -1px; }      /* the key that works the switch, small, above it */
  .opener { position: absolute; right: -1px; bottom: -1px; width: calc(16px * var(--k)); height: calc(15px * var(--k)); font-size: calc(11px * var(--k)); line-height: calc(15px * var(--k));
            text-align: center; color: #17120a; background: #d9b65a; }
  .opener.on { background: #ffe39a; }
  #inv button { font: inherit; font-size: calc(11px * var(--t)); letter-spacing: .16em; color: #e8d9a8; background: #17120a;
                border: 1px solid #d9b65a; padding: calc(6px * var(--t)) calc(10px * var(--t)); cursor: pointer; }
  .weight { align-self: center; font-size: calc(12px * var(--t)); color: #c9bb8e; }
  #info { min-height: calc(18px * var(--t)); font-size: calc(13px * var(--t)); text-align: center; text-shadow: 0 1px 2px #000; max-width: min(96vw, 760px); }
  #info b { color: #ffe39a; font-weight: normal; }
  #info i { color: #e9a86a; font-style: normal; white-space: nowrap; }
  #heldIcon { display: none; position: fixed; width: calc(44px * var(--k)); height: calc(44px * var(--k)); margin: 6px 0 0 6px; background-size: contain;
              image-rendering: pixelated; pointer-events: none; }
  body.touch #heldIcon { left: 50% !important; top: 40% !important; }
  #prompt { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 12px 22px;
            border: 1px solid #d9b65a; background: rgba(0,0,0,.72); letter-spacing: .14em; font-size: calc(14px * var(--t)); pointer-events: none; }
  #cross { position: fixed; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; background: rgba(232,217,168,.6);
           border-radius: 50%; pointer-events: none; }
  #touch { display: none; }
  body.touch #touch { display: block; }
  #stick { display: none; position: fixed; width: 110px; height: 110px; margin: -55px; border: 2px solid rgba(217,182,90,.55);
           border-radius: 50%; pointer-events: none; }
  #knob { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; border-radius: 50%;
          background: rgba(217,182,90,.5); transform: translate(-50%,-50%); }
  #touch button { position: fixed; right: 18px; width: calc(74px * var(--b)); height: calc(74px * var(--b)); border-radius: 50%; font: inherit; font-size: calc(13px * var(--b));
                  letter-spacing: .08em; color: #e8d9a8; background: rgba(0,0,0,.45); border: 2px solid rgba(217,182,90,.7);
                  touch-action: none; }
  /* --lift: on a narrow screen the buttons stand above the hot bar */
  #touch button[data-act=jump] { bottom: calc(var(--lift, 0px) + 26px * var(--b)); }
  #touch button[data-act=lamp] { bottom: calc(var(--lift, 0px) + 114px * var(--b)); }
  #touch button[data-act=target] { bottom: calc(var(--lift, 0px) + 202px * var(--b)); font-size: calc(11px * var(--b)); }
  #touch button[data-act=attack] { bottom: calc(var(--lift, 0px) + 26px * var(--b)); right: calc(18px + 86px * var(--b)); border-color: rgba(200,70,50,.8); }
  #touch button[data-act=block] { bottom: calc(var(--lift, 0px) + 114px * var(--b)); right: calc(18px + 86px * var(--b)); }
  #touch button[data-act=dodge] { bottom: calc(var(--lift, 0px) + 202px * var(--b)); right: calc(18px + 86px * var(--b)); }
  #touch button[data-act=map] { top: 104px; right: 82px; width: 62px; height: 34px; border-radius: 6px; font-size: 11px; }
  #touch button[data-act=menu] { top: 104px; right: 14px; width: 62px; height: 34px; border-radius: 6px; font-size: 11px; }


  /* ---- the map: a page of your notebook ---- */
  #map { display: none; position: fixed; inset: 0; z-index: 30; flex-direction: column; align-items: center; justify-content: center;
         gap: 8px; padding: 8px 0; box-sizing: border-box; background: rgba(4,3,2,.8); }
  #mapTop { display: flex; gap: 10px; }
  #mapTop button { font: inherit; font-size: 11px; letter-spacing: .16em; color: #e8d9a8; background: #17120a; border: 1px solid #d9b65a;
                   padding: 7px 14px; cursor: pointer; }
  #mapTop button:hover { background: #d9b65a; color: #17120a; }
  #mapPage { position: relative; width: min(96vw, 1040px); flex: 0 1 740px; min-height: 0; box-shadow: 0 10px 40px #000; }
  #mapCanvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; }
  #map3d { display: none; position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  #map3dNone { display: none; position: absolute; left: 0; right: 0; top: 46%; text-align: center; font: italic 20px var(--book); color: rgba(52,50,48,.75); pointer-events: none; }
  #mapNote { display: none; position: absolute; width: 190px; box-sizing: border-box; padding: 0 4px; font: italic 17px var(--book);
             color: #2b2a28; background: rgba(255,255,255,.45); border: 0; border-bottom: 1px solid #6b665c; outline: 0;
             user-select: text; -webkit-user-select: text; }
  #mapHint { max-width: 94vw; font-size: calc(12px * var(--t)); line-height: 1.4; text-align: center; color: #c9bb8e; }

  /* ---- fighting ---- */
  #bars { position: fixed; right: 14px; top: 12px; width: min(calc(210px * var(--u)), 40vw); pointer-events: none; }
  .barRow { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .barRow label { width: 62px; text-align: right; font-size: 10px; letter-spacing: .22em; color: #a89868; }
  .bar { flex: 1; height: 9px; padding: 1px; border: 1px solid #d9b65a; background: rgba(8,6,3,.8);
         clip-path: polygon(4px 0, calc(100% - 4px) 0, 100% 50%, calc(100% - 4px) 100%, 4px 100%, 0 50%); }
  .bar i { display: block; height: 100%; width: 100%; }
  .barRow.small { margin-bottom: 4px; } .barRow.small .bar { height: 5px; }
  #foodBar { background: #b98a4a; } #restBar { background: #6f8fc0; } #lightBar { background: linear-gradient(#ffd27a, #e8892a); }
  #lightMin { width: 34px; font-size: 10px; letter-spacing: .08em; color: #a89868; }
  #lightRow.off #lightBar { opacity: .45; filter: grayscale(.6); } #lightRow.low label, #lightRow.low #lightMin { color: #ff5a36; } #lightRow.low #lightBar { background: #ff5a36; }
  #airBar { background: linear-gradient(#bfeaf2, #5fa9bd); }
  #airRow { margin-top: 8px; } #airRow.out label { color: #ff5a36; } #airRow.out #airBar { background: #ff5a36; }
  #hpBar { background: linear-gradient(#d24a34, #8a2416); }
  #stBar { background: linear-gradient(#e8d9a8, #a89868); }
  /* ---- the creature you are fighting: a frame round it, its name and health, and numbers that rise when it is hit ---- */
  #tgt { display: none; position: fixed; pointer-events: none; z-index: 4; color: #d9b65a; }
  #tgt i { position: absolute; width: 24%; height: 18%; max-width: 30px; max-height: 30px; border: 0 solid currentColor; filter: drop-shadow(0 0 2px #000); }
  #tgt i:nth-of-type(1) { left: 0; top: 0; border-width: 2px 0 0 2px; }
  #tgt i:nth-of-type(2) { right: 0; top: 0; border-width: 2px 2px 0 0; }
  #tgt i:nth-of-type(3) { left: 0; bottom: 0; border-width: 0 0 2px 2px; }
  #tgt i:nth-of-type(4) { right: 0; bottom: 0; border-width: 0 2px 2px 0; }
  #tgt.lock i { width: 50%; height: 50%; max-width: none; max-height: none; }      /* locked: the frame closes */
  #tgt.near { color: #ff5a36; }
  #tgt.warn { color: #fff; animation: tgtWarn .16s steps(2) infinite; }
  @keyframes tgtWarn { 50% { color: #ff5a36; } }
  #tgtHead { position: absolute; left: 50%; transform: translateX(-50%); white-space: nowrap; text-align: center;
                       font-size: 11px; letter-spacing: .16em; text-shadow: 0 1px 2px #000, 0 0 4px #000; }
  #tgtHead { bottom: 100%; margin-bottom: 6px; color: #e8d9a8; }
  #tgtHead div { width: 86px; height: 5px; margin: 4px auto 0; box-sizing: content-box; padding: 1px; border: 1px solid #d9b65a; background: rgba(8,6,3,.8); }
  #tgtBar { display: block; height: 100%; background: linear-gradient(#d24a34, #8a2416); }
  #tgtFoot { display: block; min-height: 13px; margin-top: 4px; color: #d9b65a; }
  #tgt.near #tgtFoot, #tgt.warn #tgtFoot { color: inherit; }
  #floats { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
  #floats b { position: absolute; transform: translate(-50%, -50%); font-size: 24px; font-weight: normal; color: #fff3c8;
              text-shadow: 0 0 3px #000, 0 2px 2px #000; animation: floatUp .95s ease-out forwards; }
  #floats b.big { font-size: 36px; color: #ffb02e; }
  #floats b.dull { font-size: 17px; color: #a3a3a3; }
  #floats b.word { font-size: 14px; letter-spacing: .14em; color: #c9bb8e; }
  @keyframes floatUp { from { opacity: 1; margin-top: 0; } 70% { opacity: 1; } to { opacity: 0; margin-top: -80px; } }
  /* ---- a text scene: your thoughts, the first time something happens ---- */
  #scene { display: none; position: fixed; inset: 0; z-index: 28; flex-direction: column; align-items: center; justify-content: flex-end;
           background: linear-gradient(rgba(4,3,2,.15), rgba(4,3,2,.7)); }
  #sceneIn { width: min(calc(720px * var(--u)), 94vw); max-height: 94vh; overflow: auto; box-sizing: border-box; margin-bottom: max(10px, 5vh);
             padding: calc(18px * var(--u)) calc(26px * var(--u)) calc(16px * var(--u)); text-align: center;
             background: linear-gradient(rgba(26,16,8,.96), rgba(10,6,3,.96)); border: 1px solid #d9b65a; box-shadow: 0 10px 40px #000; }
  #sceneTitle { margin: 0 0 10px; font-weight: normal; font-size: 13px; letter-spacing: .3em; text-transform: uppercase; color: #ecc96c; }
  #sceneLines { text-align: left; }
  #sceneLines p { margin: 0 0 calc(7px * var(--u)); font-family: var(--book); font-size: calc(18px * var(--u)); line-height: 1.4; color: #efe4c0;
                  opacity: 0; animation: sceneLine .7s ease-out forwards; }
  @keyframes sceneLine { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
  #sceneGo { margin-top: 8px; font: inherit; font-size: 11px; letter-spacing: .2em; color: #e8d9a8; background: #17120a; border: 1px solid #d9b65a;
             padding: 9px 22px; cursor: pointer; }
  #sceneGo:hover { background: #d9b65a; color: #17120a; }
  #wind { position: fixed; left: 50%; top: calc(54% + 48px); z-index: 7; transform: translateX(-50%); width: 84px; text-align: center;
          font-size: 10px; letter-spacing: .22em; color: #e8d9a8; text-shadow: 0 1px 2px #000; opacity: 0; pointer-events: none; }
  #skin { position: fixed; left: 50%; top: calc(54% + 34px); z-index: 7; transform: translateX(-50%); width: 160px; text-align: center;
          font-size: 10px; letter-spacing: .22em; color: #e8d9a8; text-shadow: 0 1px 2px #000; opacity: 0; pointer-events: none; }
  #skin div { height: 6px; margin-bottom: 4px; border: 1px solid #d9b65a; background: rgba(8,6,3,.7); }
  #skin i { display: block; height: 100%; width: 0; background: #b8923a; }
  #wind div { height: 4px; margin-bottom: 4px; border: 1px solid #d9b65a; background: rgba(8,6,3,.7); }
  #wind i { display: block; height: 100%; width: 0; background: #d9b65a; }
  #hurt { position: fixed; inset: 0; opacity: 0; pointer-events: none;
          background: radial-gradient(ellipse at center, rgba(150,20,10,0) 35%, rgba(150,20,10,.75) 100%); }
  #hit { position: fixed; inset: 0; opacity: 0; pointer-events: none;            /* the flash of a blow landing */
         background: radial-gradient(ellipse at center, rgba(190,25,10,.35) 0%, rgba(120,10,5,.9) 100%); }
  #settingsBtn { position: fixed; right: 14px; top: 96px; z-index: 6; font: inherit; font-size: 10px; letter-spacing: .2em; color: #e8d9a8;
                 background: rgba(8,6,3,.8); border: 1px solid #d9b65a; padding: 6px 10px; cursor: pointer; }
  #settingsBtn:hover { background: #d9b65a; color: #17120a; }
  body.touch #settingsBtn { display: none; }      /* a touch screen has its own MENU button */
  /* ---- a shop: their things on the left, yours on the right (src/shop.js) ---- */
  #shop { display: none; position: fixed; inset: 0; z-index: 29; align-items: center; justify-content: center; background: rgba(4,3,2,.72); }
  #shopIn { width: min(calc(860px * var(--u)), 96vw); max-height: 94vh; display: flex; flex-direction: column; box-sizing: border-box;
            padding: calc(14px * var(--u)) calc(18px * var(--u)); background: linear-gradient(rgba(26,16,8,.97), rgba(10,6,3,.97)); border: 1px solid #d9b65a; box-shadow: 0 10px 40px #000; }
  #shopTitle { margin: 0 0 8px; text-align: center; font-weight: normal; font-size: 13px; letter-spacing: .3em; color: #ecc96c; }
  #shopCols { display: flex; gap: 14px; min-height: 0; flex: 1; }
  #shopCols > div { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #shopCols h4 { margin: 0 0 6px; font-weight: normal; font-size: 10px; letter-spacing: .25em; color: #b89a5a; }
  #shopTheirs, #shopMine { overflow-y: auto; display: flex; flex-direction: column; gap: 5px; padding-right: 4px; max-height: 58vh; }
  #shop .ware { position: relative; text-align: left; font: inherit; color: #efe4c0; background: #17120a; border: 1px solid #5a4620; padding: 7px 50px 7px 10px; cursor: pointer; }
  #shop .ware:hover, #shop .ware.focus { border-color: #d9b65a; }
  #shop .ware.focus, #shopBtns button.focus { outline: 2px solid #ffe39a; outline-offset: 1px; }
  #shop .ware.on { border-color: #ecc96c; background: #3a2c10; }
  #shop .ware b { display: block; font-weight: normal; font-size: calc(15px * var(--u)); font-family: var(--book); }
  #shop .ware i { display: block; font-style: normal; font-size: 11px; color: #c9bb8e; margin-top: 2px; }
  #shop .ware i.stats { color: #ecc96c; }

// The sizes of everything on the screen follow the size of the screen. See the :root note in the styles.
(function () {
  const R = document.documentElement, cl = (a, v, b) => Math.max(a, Math.min(b, v));
  function fit() {
    const w = innerWidth, h = innerHeight, f = Math.min(w / 800, h / 560);
    const phone = Math.min(w, h) < 520 && matchMedia('(pointer: coarse)').matches || new URLSearchParams(location.search).get('phone') === '1';
    const u = cl(0.7, f, 1.25), k = phone ? Math.min(0.64, (w - 16) / 620) : u;
    R.style.setProperty('--u', u.toFixed(3));
    R.style.setProperty('--k', k.toFixed(3));
    R.style.setProperty('--t', cl(0.85, f, 1.15).toFixed(3));
    R.style.setProperty('--b', cl(0.72, f, 1.1).toFixed(3));
    R.style.setProperty('--z', Math.min(1, h / 600).toFixed(3));
    lift();
    R.classList.toggle('phone', phone);
  }
  // On a narrow screen the touch buttons stand above the hot bar and whatever is open over it.
  function lift() {
    const inv = document.getElementById('inv');
    R.style.setProperty('--lift', inv && innerWidth < 620 ? (inv.offsetHeight + 12) + 'px' : '0px');
  }
  addEventListener('DOMContentLoaded', () => { new ResizeObserver(lift).observe(document.getElementById('inv')); lift(); });
  fit(); addEventListener('resize', fit);
  // No browser menu on a right click, anywhere on the page (title card, journal, menus, game).
  addEventListener('contextmenu', e => e.preventDefault(), true);
  // The page must never be zoomed (Mirko, iPad: "the game zooms in about 4 times and it's not possible to go back"). Safari
  // lets a pinch or a double tap zoom any part of the page that does not forbid it (the map, the menus, the story pages), and
  // the game's own picture then takes every pinch, so there was no way out. Three guards: the touch-action rule in the
  // styles; Safari's own pinch events are refused here; and if the page is found zoomed anyway it is put back.
  for (const ev of ['gesturestart', 'gesturechange', 'gestureend']) document.addEventListener(ev, e => e.preventDefault(), { passive: false });
  document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  const vv = window.visualViewport, meta = document.querySelector('meta[name=viewport]'), base = meta.content;
  let wait = 0;
  function unzoom() {
    if (!vv || vv.scale < 1.02) return;
    meta.content = 'width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover';      // writing the tag again makes Safari go back to 1
    setTimeout(() => { meta.content = base; scrollTo(0, 0); }, 60);

  if (vv) for (const ev of ['resize', 'scroll']) vv.addEventListener(ev, () => { clearTimeout(wait); wait = setTimeout(unzoom, 300); });
})();

    <div id="ldName">LOADING</div>

<script>
// The loading page. The game reports how far it has got with loading.set(0..1, words); loading.finish() fills the bar, lets the
// page fade, and says when it is gone. The bar never moves faster than it can be seen, so a quick load still shows it fill.
window.loading = (() => {
  const page = document.getElementById('loading'), fill = document.getElementById('ldFill'), note = document.getElementById('ldNote');
  let target = 0, shown = 0, last = performance.now(), finishing = null, hide = null;
  function tick() {
    const now = performance.now(), dt = Math.min(0.5, (now - last) / 1000); last = now;      // a timer, not animation frames: those stop in a hidden tab
    shown = Math.min(target, shown + Math.max(0.15 * dt, (target - shown) * 3 * dt), shown + dt * 1.1);
    fill.style.width = (shown * 100).toFixed(1) + '%';
    if (finishing && shown >= 1) {
      page.classList.add('off');
      setTimeout(() => { page.style.display = 'none'; }, 850);
      finishing(); finishing = null; clearInterval(timer);
    }
  }
  const timer = setInterval(tick, 33);
  return {
    set(p, words) { target = Math.max(target, Math.min(0.97, p)); if (words) note.textContent = words; },
    name(text) { document.getElementById('ldName').textContent = text; },
    finish() { target = 1; return new Promise(res => { finishing = res; }); },
  };
})();
</script>
